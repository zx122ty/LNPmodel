      # NOTE: "unicore" is deliberately NOT listed here. It is not on PyPI --
      # it is the local Uni-Core source shipped in this repo (Uni-Core-main/,
      # version.txt == 0.0.1), and its setup.py does `import torch` at module
      # level. pip builds all local packages BEFORE installing anything, and
      # PEP 517 build isolation gives that build env no torch, so an editable
      # entry here can never resolve. Install it as a second step, after the
      # env exists:
      #   pip install --no-build-isolation -e ./Uni-Core-main
      # Uni-Core only builds its CUDA extensions when passed --enable-cuda-ext
      # (DISABLE_CUDA_EXTENSION defaults to True), so that step stays
      # pure-Python and needs no nvcc.
